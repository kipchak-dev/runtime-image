; Production settings for the hardened Kipchak runtime.
;
; Add your own settings in /etc/frankenphp/php.d/*.ini, or with php_ini in the Caddyfile, rather than replacing
; this file.

; Errors are logged to stderr and never shown to clients.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
zend.assertions = -1
expose_php = Off

; No shell or other programs exist in the image to run. Disabling these functions turns any attempt into a clear
; error rather than a failed exec, and removes them from an attacker's reach.
disable_functions = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec

allow_url_include = Off
allow_url_fopen = On

variables_order = "GPCS"
request_order = "GP"
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 50M
upload_max_filesize = 50M
max_input_vars = 5000
date.timezone = UTC

; Everything an API writes at runtime goes to /tmp, the only writable directory for the runtime user. Mount an
; emptyDir there to run with a read-only root filesystem.
sys_temp_dir = /tmp
upload_tmp_dir = /tmp

; Statically built PHP does not know where the system certificates are.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

mail.add_x_header = Off

; The application's code is part of the image and never changes, so OPcache never needs to check it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
