# Builds the Kipchak Runtime Image into the private build package ghcr.io/kipchak-dev/runtime-builds, under build tags
# <line>-<image>-<12-character commit>, each with a build provenance attestation. For each PHP line in
# php-hardened/build.env it builds four indexes, each for linux/amd64 and linux/arm64 on native runners:
#   sources   the source set the binaries are compiled from, for rebuilding with no network
#   runtime   the static FrankenPHP binary on an empty filesystem
#   build     the runtime's binaries on Debian, for building an application image
#   alpine    the runtime's binaries on Alpine, to extend
#
# This workflow publishes nothing that customers pull. Mamluk's pipeline checks each build's attestation and its
# inputs, rebuilds it for comparison, copies it by digest to Mamluk's registry and signs it with Mamluk's key. Builds
# in runtime-builds are unsigned, transient and unsupported.
#
# Only a push to master, the weekly schedule and a manual run can build and publish: pull requests run
# .github/workflows/checks.yml, which has no write permission.
name: build

on:
  push:
    branches: [master]
    paths:
      - "php-hardened/**"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The latest release of each PHP line, the ISO week and each build's source-set name, resolved once so that every
  # job of the run, and Mamluk's comparison build, use the same values.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.resolve.outputs.lines }}
      epoch: ${{ steps.resolve.outputs.epoch }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve the releases
        run: |
          set -eu
          . php-hardened/build.env
          stamp="$(date -u +%Y%m%dT%H%M)"
          lines="[]"
          for line in $PHP_LINES; do
            release="$(curl -fsSL "https://www.php.net/releases/index.php?json&version=$line" | jq -r '.version // empty')"
            case "$release" in "$line".*) ;; *) echo "Could not find the latest PHP $line release on php.net" >&2; exit 1 ;; esac
            lines="$(printf '%s' "$lines" | jq -c --arg l "$line" --arg r "$release" --arg s "$release-$stamp" '. + [{line: $l, release: $r, set: $s}]')"
          done
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          # The download cache's revision, as the Dockerfile sets it, so that the saved cache's key and the Dockerfile's
          # cache name always agree (K-REG-1).
          revision="$(sed -n 's/^ARG SOURCES_REVISION=\([0-9][0-9]*\)$/\1/p' php-hardened/Dockerfile)"
          case "$revision" in '' | *[!0-9]*) echo "Could not read SOURCES_REVISION from the Dockerfile" >&2; exit 1 ;; esac
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "$lines"

  # The source set and the runtime for one line and one platform, in one job and one builder, so that both use the
  # same compile.
  binary:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.resolve.outputs.lines) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: binary ${{ matrix.php.line }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      # To attest the saved download cache's manifest (K-REG-1), as the index jobs attest the images.
      attestations: write
      id-token: write
    env:
      CACHE_PREFIX: spc-sources-${{ needs.resolve.outputs.revision }}-${{ matrix.platform.arch }}-${{ needs.resolve.outputs.epoch }}-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disk before the build
        run: df -h / "$RUNNER_TEMP"
      # The weekly download cache (K-REG-1). Each job starts on a fresh runner, so the downloads an earlier build saved
      # this week, for this architecture, are restored here and checked before the build may use them. The key never
      # matches exactly, so the newest saved entry with this week's prefix is restored.
      - name: Restore this week's downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads-cache
          key: ${{ env.CACHE_PREFIX }}none
          restore-keys: ${{ env.CACHE_PREFIX }}
      - name: Check the restored downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh php-hardened/downloads-cache.sh seed "$RUNNER_TEMP/downloads-cache" "$RUNNER_TEMP/downloads-seed" "$GITHUB_REF" "$GITHUB_REPOSITORY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # static-php-cli downloads most library sources from GitHub, which allows few API requests without a token. The
      # run's own token reaches the build only as a secret mount, never as an argument (php-hardened/tests).
      - name: Build the source set
        id: sources
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: php-hardened
          target: sources-set
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          provenance: false
          sbom: false
          secrets: github_token=${{ github.token }}
          build-contexts: downloads-seed=${{ runner.temp }}/downloads-seed
          build-args: |
            PHP_VERSION=${{ matrix.php.release }}
            SOURCES_EPOCH=${{ needs.resolve.outputs.epoch }}
            SOURCES_SET=${{ matrix.php.set }}
          outputs: type=image,name=ghcr.io/kipchak-dev/runtime-builds,push-by-digest=true,name-canonical=true,push=true
      # One retry, only for a download fault upstream (K-REG-1, option C): download-fault.sh reads the failed build's log
      # and allows it only when an upstream download failed and no check did. The retry runs in the same builder, so it
      # starts from everything the first attempt downloaded.
      - name: Decide whether to retry the source set
        id: fault
        if: steps.sources.outcome == 'failure'
        run: |
          set -eu
          docker buildx history logs > "$RUNNER_TEMP/sources-attempt-1.log" 2>&1 || true
          grep -aE 'Download failed|Failed to get GitHub|Could not clone|Source files not fetched' "$RUNNER_TEMP/sources-attempt-1.log" | tail -n 5 || true
          sh php-hardened/download-fault.sh "$RUNNER_TEMP/sources-attempt-1.log"
          sleep 600
      - name: Build the source set (retry after a download fault)
        id: sources-retry
        if: steps.sources.outcome == 'failure' && steps.fault.outcome == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: php-hardened
          target: sources-set
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          provenance: false
          sbom: false
          secrets: github_token=${{ github.token }}
          build-contexts: downloads-seed=${{ runner.temp }}/downloads-seed
          build-args: |
            PHP_VERSION=${{ matrix.php.release }}
            SOURCES_EPOCH=${{ needs.resolve.outputs.epoch }}
            SOURCES_SET=${{ matrix.php.set }}
          outputs: type=image,name=ghcr.io/kipchak-dev/runtime-builds,push-by-digest=true,name-canonical=true,push=true
      # Saves what this job downloaded, as soon as the source set is built or has failed, so that a re-run this week starts
      # from it; nothing later downloads. The
      # manifest is attested with this workflow's identity on this branch; the restore above accepts nothing else.
      # The same path as the restore, since the cache matches entries by path as well as key.
      - name: Clear the restored downloads
        if: ${{ !cancelled() }}
        run: rm -rf "$RUNNER_TEMP/downloads-cache"
      - name: Copy out this week's downloads
        id: downloads-out
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: php-hardened
          target: downloads-out
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          sbom: false
          build-args: |
            SOURCES_EPOCH=${{ needs.resolve.outputs.epoch }}
            DOWNLOADS_COPY_ID=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          outputs: type=local,dest=${{ runner.temp }}/downloads-cache
      - name: Check and list the downloads to save
        id: downloads-manifest
        if: ${{ !cancelled() && steps.downloads-out.outcome == 'success' }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh php-hardened/downloads-cache.sh no-token "$RUNNER_TEMP/downloads-cache"
          sh php-hardened/downloads-cache.sh manifest "$RUNNER_TEMP/downloads-cache"
          du -sh "$RUNNER_TEMP/downloads-cache"
      - name: Attest the downloads manifest
        id: downloads-attest
        if: ${{ !cancelled() && steps.downloads-manifest.outcome == 'success' }}
        # A cache that could not be saved costs the next run a full download, not this build.
        continue-on-error: true
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/downloads-cache/SHA256SUMS
      - name: Save this week's downloads
        if: ${{ !cancelled() && steps.downloads-attest.outcome == 'success' }}
        # A cache that could not be saved costs the next run a full download, not this build.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads-cache
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.php.line }}
      - name: Build the runtime
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: php-hardened
          target: runtime
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          sbom: false
          secrets: github_token=${{ github.token }}
          build-args: |
            PHP_VERSION=${{ matrix.php.release }}
            SOURCES_EPOCH=${{ needs.resolve.outputs.epoch }}
            SOURCES_SET=${{ matrix.php.set }}
          outputs: type=image,name=ghcr.io/kipchak-dev/runtime-builds,push-by-digest=true,name-canonical=true,push=true
      - name: Record the digests
        env:
          SOURCES: ${{ steps.sources.outputs.digest || steps.sources-retry.outputs.digest }}
          RUNTIME: ${{ steps.runtime.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -eu
          for d in "$SOURCES" "$RUNTIME"; do
            printf '%s\n' "$d" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "A build reported no digest" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/runtime"
          printf '%s\n' "$SOURCES" > "$RUNNER_TEMP/sources/$ARCH"
          printf '%s\n' "$RUNTIME" > "$RUNNER_TEMP/runtime/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php.line }}-sources-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/sources/${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php.line }}-runtime-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/runtime/${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1
      - name: Disk after the build
        if: always()
        run: df -h / "$RUNNER_TEMP"

  binary-index:
    needs: [resolve, binary]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.resolve.outputs.lines) }}
        image: [sources, runtime]
    name: index ${{ matrix.php.line }} ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/index
        with:
          line: ${{ matrix.php.line }}
          image: ${{ matrix.image }}

  # The build and Alpine images, built from this run's attested runtime index by digest, as Mamluk's pipeline builds
  # them from the published runtime. If the runtime failed, they fail too, because its build tag does not exist.
  derived:
    needs: [resolve, binary-index]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.resolve.outputs.lines) }}
        image: [build, alpine]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: ${{ matrix.image }} ${{ matrix.php.line }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find this run's runtime index
        id: runtime
        env:
          LINE: ${{ matrix.php.line }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="ghcr.io/kipchak-dev/runtime-builds:$LINE-runtime-${SHA:0:12}"
          digest="sha256:$(skopeo inspect --raw "docker://$tag" | sha256sum | awk '{print $1}')"
          echo "source=ghcr.io/kipchak-dev/runtime-builds@$digest" >> "$GITHUB_OUTPUT"
          echo "Runtime: $tag ($digest)"
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: php-hardened
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PHP_VERSION=${{ matrix.php.release }}
            SOURCES_EPOCH=${{ needs.resolve.outputs.epoch }}
            SOURCES_SET=${{ matrix.php.set }}
            RUNTIME_SOURCE=${{ steps.runtime.outputs.source }}
          outputs: type=image,name=ghcr.io/kipchak-dev/runtime-builds,push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -eu
          printf '%s\n' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "The build reported no digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digest" && printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php.line }}-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1

  derived-index:
    needs: [resolve, derived]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.resolve.outputs.lines) }}
        image: [build, alpine]
    name: index ${{ matrix.php.line }} ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/index
        with:
          line: ${{ matrix.php.line }}
          image: ${{ matrix.image }}
